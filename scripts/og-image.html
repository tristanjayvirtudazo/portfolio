<!doctype html>
<!--
  Template for public/og-image.png (the 1200×630 link-preview image). After editing, regenerate:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og-image.png "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        font-family: 'Geist', system-ui, sans-serif; color: #1c1917; background: #fcfbf8;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(249, 115, 22, 0.35) 1.5px, transparent 1.5px);
        background-size: 26px 26px;
        mask-image: linear-gradient(110deg, black 0%, rgba(0, 0, 0, 0.35) 60%, transparent 100%);
      }
      .glow {
        position: absolute; width: 760px; height: 520px; right: -120px; top: -160px;
        border-radius: 50%; background: rgba(249, 115, 22, 0.22); filter: blur(90px);
      }
      .content { position: absolute; left: 80px; top: 0; bottom: 0; width: 640px;
        display: flex; flex-direction: column; justify-content: center; }
      .role { display: flex; align-items: center; gap: 12px; color: #c2410c;
        font-size: 26px; font-weight: 500; }
      .role::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #f97316; }
      h1 { margin-top: 18px; font-size: 76px; line-height: 1.02; font-weight: 600; letter-spacing: -0.03em; }
      h1 span { color: #f97316; }
      .tagline { margin-top: 24px; font-size: 27px; line-height: 1.4; color: #57534e; }
      .stack { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px; }
      .stack span { padding: 7px 16px; border-radius: 999px; font-size: 20px; font-weight: 500;
        color: #c2410c; background: #fff7ed; border: 1.5px solid rgba(249, 115, 22, 0.35); }
      .portrait { position: absolute; right: 70px; top: 50%; translate: 0 -50%; width: 400px; }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="glow"></div>
    <div class="content">
      <p class="role">Software Engineer</p>
      <h1>Tristan Jay Virtudazo<span>.</span></h1>
      <p class="tagline">Bridging seamless user experience with clean, maintainable web architecture</p>
      <div class="stack">
        <span>Nuxt</span><span>Vue.js</span><span>Kotlin</span><span>Spring Boot</span><span>PostgreSQL</span>
      </div>
    </div>
    <img class="portrait" src="../public/images/tristan-seesnap.png" alt="" />
  </body>
</html>
