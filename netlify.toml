# Netlify configuration: builds the pre-rendered site and serves it with caching and security headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches "engines" in package.json.
  NODE_VERSION = "24"

# Vite fingerprints everything in /assets, so those files can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
